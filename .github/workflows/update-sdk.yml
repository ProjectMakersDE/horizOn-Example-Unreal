name: Update SDK

# Copies Plugins/HorizonSDK from a horizOn-SDK-Unreal release tag.
# horizOn-SDK-Unreal sends the update-sdk dispatch after a release.

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:
    inputs:
      version:
        description: SDK version, for example 1.6.0 (empty = latest release)
        required: false

permissions:
  contents: write

env:
  SDK_REPO: ProjectMakersDE/horizOn-SDK-Unreal

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SDK release
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view -R "$SDK_REPO" --json tagName -q .tagName)
            VERSION="${VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SDK version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout example project
        uses: actions/checkout@v4

      - name: Checkout SDK at release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: v${{ steps.sdk.outputs.version }}
          path: sdk-source
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Replace SDK files
        run: |
          rm -rf Plugins/HorizonSDK
          cp -r sdk-source/Plugins/HorizonSDK Plugins/HorizonSDK

      - name: Cleanup
        run: rm -rf sdk-source

      - name: Commit and push
        env:
          VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "SDK is already at v${VERSION}"
          else
            git commit -m "chore(sdk): update horizOn SDK to v${VERSION}"
            git push
          fi
